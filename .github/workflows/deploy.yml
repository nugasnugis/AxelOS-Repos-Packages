name: Deploy APT Repo

on:
  push:
    branches:
      - main

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup APT Repository via Reprepro
        uses: morph027/apt-repo-action@v3
        id: create-apt-repo
        with:
          # Explicit naming resolves the "invalid package name" error
          repo-name: "myaxel"
          
          # Pass your GPG private key and passphrase from repository secrets
          signing-key: ${{ secrets.GPG_PRIVATE_KEY }}
          signing-key-passphrase: ${{ secrets.GPG_PASSPHRASE }} # Leave empty if your key has no passphrase
          
          # Optional customization values
          codename: "zena"
          components: "main"
          architectures: "amd64,arm64"

      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          name: github-pages
          path: ${{ steps.create-apt-repo.outputs.dir }}

      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v4

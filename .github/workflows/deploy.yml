name: Generate Debian APT Repository

on:
  push:
    branches:
      - main
    paths:
      - 'incoming/**'

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  build-repo:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository Code
        uses: actions/checkout@v4

      - name: Install Reprepro Engine
        run: |
          sudo apt-get update
          sudo apt-get install reprepro devscripts -y

      - name: Import GPG Key
        uses: crazy-max/ghaction-import-gpg@v6
        id: import-gpg
        with:
          gpg_private_key: ${{ secrets.GPG_PRIVATE_KEY }}
          passphrase: ${{ secrets.GPG_PASSPHRASE }}

      - name: Configure Reprepro Multi-Codename Index
        run: |
          mkdir -p conf
          cat << 'EOF' > conf/distributions
          Origin: AxelOS
          Label: AxelOS Official Update Mirror
          Codename: zena
          Architectures: amd64 i386 arm64 source
          Components: main
          Description: APT repository for AxelOS Custom Builds (Stable)
          SignWith: ${{ steps.import-gpg.outputs.keyid }}

          Origin: AxelOS
          Label: AxelOS Testing Update Mirror
          Codename: forky
          Architectures: amd64 i386 arm64 source
          Components: main
          Description: APT repository for AxelOS Custom Builds (Testing)
          SignWith: ${{ steps.import-gpg.outputs.keyid }}
          EOF

      - name: Process Incoming Packages Automatically
        run: |
          # Process any files dropped into an incoming/zena/ folder
          if [ -d "incoming/zena" ]; then
            find incoming/zena/ -name "*.deb" -exec reprepro -V includedeb zena {} \;
          fi
          
          # Process any files dropped into an incoming/forky/ folder
          if [ -d "incoming/forky" ]; then
            find incoming/forky/ -name "*.deb" -exec reprepro -V includedeb forky {} \;
          fi
          
          # Export public security validation certificate
          gpg --armor --export ${{ steps.import-gpg.outputs.keyid }} > public.key
          
          # Clean out processed setup tracks to keep repo light
          rm -rf incoming/

      - name: Deploy Compiled Layout to GitHub Pages Branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: .
          publish_branch: gh-pages

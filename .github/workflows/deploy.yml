name: Generate Debian APT Repository

on:
  push:
    branches:
      - main
    paths:
      - 'incoming/**'
      - 'dist.json'

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  build-repo:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository Code
        uses: actions/checkout@v4

      - name: Install Reprepro and JSON Processor
        run: |
          sudo apt-get update
          sudo apt-get install reprepro devscripts jq -y

      - name: Import GPG Key
        uses: crazy-max/ghaction-import-gpg@v6
        id: import-gpg
        with:
          gpg_private_key: ${{ secrets.GPG_PRIVATE_KEY }}
          passphrase: ${{ secrets.GPG_PASSPHRASE }}

      - name: Purely Dynamic Reprepro Index Generator
        run: |
          mkdir -p conf
          rm -f conf/distributions
          
          # Use jq to iterate through your dist.json and output a compliant reprepro structure
          jq -c '.distributions[]' dist.json | while read -r item; do
            CODENAME=$(echo "$item" | jq -r '.codename')
            LABEL=$(echo "$item" | jq -r '.label')
            DESC=$(echo "$item" | jq -r '.description')
            
            cat << EOF >> conf/distributions
          Origin: AxelOS
          Label: $LABEL
          Codename: $CODENAME
          Architectures: amd64 i386 arm64 source
          Components: main
          Description: $DESC
          SignWith: ${{ steps.import-gpg.outputs.keyid }}

          EOF
          done

      - name: Purely Dynamic Incoming Scanner Engine
        run: |
          # Dynamically parse the json configuration to identify what directories to scan
          CODENAMES=$(jq -r '.distributions[].codename' dist.json)
          
          for CODE in $CODENAMES; do
            echo "[*] Scanning for incoming packages for codename: $CODE"
            
            # Match folder variations using a case-insensitive search engine loop
            find incoming/ -iname "$CODE" -type d | while read -r dir; do
              if [ -d "$dir" ] && [ "$(find "$dir" -name "*.deb" | wc -l)" -gt 0 ]; then
                echo "    -> Processing payload found inside $dir into distribution $CODE..."
                find "$dir" -name "*.deb" -exec reprepro -V includedeb "$CODE" {} \;
              fi
            done
          done
          
          # Cleanup old abandoned versions and sign public cryptographic blocks
          reprepro clearvanished
          gpg --armor --export ${{ steps.import-gpg.outputs.keyid }} > public.key
          rm -rf incoming/

      - name: Deploy Compiled Layout to GitHub Pages Branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: .
          publish_branch: gh-pages

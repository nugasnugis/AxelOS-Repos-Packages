name: Deploy APT Repository

on:
  push:
    branches:
      - main

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup APT Repository via Reprepro
        uses: morph027/apt-repo-action@v3
        with:
          repo_supported_arch: 'amd64 arm64'
          repo_supported_version: 'zena'
          private_key: ${{ secrets.GPG_PRIVATE_KEY }}
          public_key: ${{ secrets.GPG_PUBLIC_KEY }}
          file: './pool/**/*.deb' # Points to where you store your raw .deb files
          
      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './dist' # Folder generated by the reprepro tool execution

      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v4
